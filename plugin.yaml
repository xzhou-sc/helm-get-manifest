apiVersion: v1
type: cli/v1
name: "get-manifest"
version: "0.1.0"
runtime: subprocess
config:
  usage: "get-manifest RELEASE [--source SOURCE] [--clean] [--list-sources]"
  shortHelp: "Filter the rendered manifest stored for an installed release by its source template"
  longHelp: |
    helm get-manifest filters the rendered manifest stored for an installed
    Helm release, selecting documents by the template that produced them.

    It adds source-aware querying similar to `helm template --show-only`, but
    operates on `helm get manifest` output rather than re-rendering the chart.
    Nothing is re-rendered, so it works when the local chart is unavailable or
    has moved on, and it can inspect any stored revision.

    Flags:
          --source SOURCE        only emit documents rendered from SOURCE,
                                 matched exactly against the "# Source:" annotation
          --clean                strip Helm source comments and the leading
                                 document separator, for piping into yq/kubectl
          --list-sources         list the distinct sources, one per line
          --revision int         inspect a specific stored revision
      -n, --namespace string     namespace scope for this request
          --kube-context string  name of the kubeconfig context to use

    Examples:
      helm get-manifest my-release
      helm get-manifest my-release --source my-chart/templates/deployment.yaml
      helm get-manifest my-release --source my-chart/templates/deployment.yaml --clean | yq '.spec'
      helm get-manifest my-release --revision 12 --source my-chart/templates/deployment.yaml
      helm get-manifest my-release --list-sources | fzf
runtimeConfig:
  platformCommand:
    - command: "${HELM_PLUGIN_DIR}/bin/get-manifest"
  platformHooks:
    install:
      - command: "${HELM_PLUGIN_DIR}/scripts/install.sh"
    update:
      - command: "${HELM_PLUGIN_DIR}/scripts/install.sh"
