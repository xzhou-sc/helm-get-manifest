apiVersion: v1
type: cli/v1
name: "get-manifest"
version: "0.1.0"
runtime: subprocess
config:
  usage: "get-manifest RELEASE [SOURCE] [flags]"
  shortHelp: "Filter the rendered manifest stored for an installed release by its source template"
  longHelp: |
    helm get-manifest filters the rendered manifest stored for an installed
    Helm release, selecting documents by the template that produced them.

    It adds source-aware querying similar to `helm template --show-only`, but
    operates on `helm get manifest` output rather than re-rendering the chart.
    Nothing is re-rendered, so it works when the local chart is unavailable or
    has moved on, and it can inspect any stored revision.

    SOURCE may be the full path Helm records, or any trailing part of it that
    is unambiguous, so "deployment" or "deployment.yaml" resolves
    "my-chart/templates/deployment.yaml". The .yaml/.yml extension is
    optional, since charts are inconsistent about which spelling they use.

    Flags:
      -s, --source SOURCE         same as passing SOURCE positionally
      -c, --clean                 strip Helm source comments and the leading
                                  document separator, for piping into yq/kubectl
      -l, --list                  list the distinct sources, one per line
      -r, --revision int          inspect a specific stored revision
      -n, --namespace string      namespace scope for this request
      -k, --kube-context string   name of the kubeconfig context to use

    Examples:
      helm get-manifest my-release
      helm get-manifest my-release deployment
      helm get-manifest my-release deployment.yaml -c | yq '.spec'
      helm get-manifest my-release deployment.yaml -r 12
      helm get-manifest my-release -l | fzf
runtimeConfig:
  platformCommand:
    - command: "${HELM_PLUGIN_DIR}/bin/get-manifest"
  platformHooks:
    install:
      - command: "${HELM_PLUGIN_DIR}/scripts/install.sh"
    update:
      - command: "${HELM_PLUGIN_DIR}/scripts/install.sh"
